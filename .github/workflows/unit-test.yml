name: Unit Test

on:
  push:
  pull_request:

env:
  ZEROEX_API_KEY: ${{ secrets.ZEROEX_API_KEY }}

jobs:
  run-unit-test:
    name: Run unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 16

      - name: Install dependencies
        run: yarn install

      - name: Run unit test
        run: yarn test:unit
